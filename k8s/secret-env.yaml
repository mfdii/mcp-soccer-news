---
# Template: update values before applying
# oc create secret generic soccer-news-env \
#   --from-literal=DB_HOST='...' \
#   --from-literal=DB_PASSWORD='...' \
#   -n <namespace>
apiVersion: v1
kind: Secret
metadata:
  name: soccer-news-env
  labels:
    app: soccer-news-mcp
type: Opaque
stringData:
  PORT: "8080"
  DB_HOST: "postgres-soccer-news"
  DB_PORT: "5432"
  DB_NAME: "soccer_news"
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME"
  DB_POOL_MAX: "20"
  DB_IDLE_TIMEOUT: "30000"
  DB_CONNECTION_TIMEOUT: "5000"
  EMBEDDING_MODEL: "Xenova/all-MiniLM-L6-v2"
  SENTIMENT_MODEL: "Xenova/distilbert-base-uncased-finetuned-sst-2-english"
  EMBEDDING_DIMENSIONS: "384"
  MAX_BATCH_SIZE: "32"
  MODEL_CACHE_PATH: "/app/.transformers-cache"
  LOG_LEVEL: "info"
