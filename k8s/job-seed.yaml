---
apiVersion: batch/v1
kind: Job
metadata:
  name: soccer-news-seed
  labels:
    app: soccer-news-mcp
spec:
  template:
    metadata:
      labels:
        app: soccer-news-mcp
        job: seed
    spec:
      containers:
      - name: seed
        image: " "
        command: ["npm", "run", "seed"]
        envFrom:
        - secretRef:
            name: soccer-news-env
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      restartPolicy: OnFailure
  backoffLimit: 3
